# Local infrastructure for development: PostgreSQL 16 + Redis 7.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyomira
      POSTGRES_PASSWORD: vyomira
      POSTGRES_DB: vyomira
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vyomira"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: {}

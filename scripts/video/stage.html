<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VYOMIRA video stage</title>
<style>
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-latin.woff2) format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Cormorant"; src: url(fonts/cormorant-latin-ext.woff2) format("woff2"); font-weight: 300 700; unicode-range: U+0100-02BA, U+20A0-20C0; }
  @font-face { font-family: "Cormorant"; font-style: italic; src: url(fonts/cormorant-italic-latin.woff2) format("woff2"); }
  @font-face { font-family: "Manrope"; src: url(fonts/manrope-latin.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Manrope"; src: url(fonts/manrope-latin-ext.woff2) format("woff2"); font-weight: 200 800; unicode-range: U+0100-02BA, U+20A0-20C0; }
  @font-face { font-family: "Deva"; src: url(../../assets/fonts/NotoSansDevanagari-Regular.ttf) format("truetype"); unicode-range: U+0900-097F; }
  :root { --navy: #080d20; --gold: #d8b477; --moon: #e9e3f5; --slate: #9ba3bc; --amethyst: #a58bff; --violet: #7256d8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); color: var(--moon); font-family: "Manrope", "Deva", sans-serif; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 72% 38%, rgba(114,86,216,.26), transparent 62%), radial-gradient(ellipse 55% 50% at 8% 95%, rgba(216,180,119,.10), transparent 60%), #080d20; }
  canvas#stars { position: absolute; inset: 0; }
  .serif { font-family: "Cormorant", "Deva", serif; font-weight: 500; letter-spacing: -0.01em; }
  .eyebrow { font-size: 22px; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  .gold { background: linear-gradient(100deg, #f1dcae, #d8b477 45%, #b98d4f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform, filter; }
  .brand { position: absolute; top: 56px; left: 80px; display: flex; align-items: center; gap: 18px; z-index: 5; }
  .brand span { font-family: "Cormorant", serif; font-size: 38px; letter-spacing: .32em; color: #e8cf9c; }
  .progress { position: absolute; left: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--amethyst), var(--gold), #fff3d6); z-index: 5; }
  .url { position: absolute; right: 80px; top: 66px; font-size: 22px; color: var(--slate); letter-spacing: .06em; z-index: 5; }
  /* hook */
  .hook { position: absolute; left: 120px; top: 300px; width: 1020px; z-index: 2; }
  .hook .l { font-size: 100px; line-height: 1.06; }
  .hook .w { display: inline-block; }
  .globeWrap { position: absolute; width: 760px; height: 760px; right: -170px; top: 170px; }
  .globeWrap canvas { width: 100%; height: 100%; border-radius: 50%; }
  .glow { position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(circle, rgba(114,86,216,.42), transparent 62%); filter: blur(30px); }
  .rim { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(165,139,255,.35); box-shadow: 0 0 120px rgba(114,86,216,.45); }
  .ring { position: absolute; inset: -34%; width: 168%; height: 168%; transform: rotate(-14deg); }
  /* shot */
  .frame { position: absolute; width: 1080px; height: 675px; top: 220px; border-radius: 28px; overflow: hidden; border: 1.5px solid rgba(165,139,255,.32); box-shadow: 0 60px 120px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.03), 0 0 140px rgba(114,86,216,.25); background: #0b1028; }
  .frame .bar { height: 44px; background: rgba(18,26,53,.95); display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid rgba(165,139,255,.15); }
  .frame .bar i { width: 12px; height: 12px; border-radius: 50%; background: rgba(233,227,245,.18); display: block; }
  .frame .bar b { margin-left: 18px; font-weight: 400; font-size: 17px; color: var(--slate); background: rgba(8,13,32,.7); padding: 5px 16px; border-radius: 999px; }
  .frame .vp { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .frame img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .caption { position: absolute; width: 540px; top: 320px; }
  .caption h2 { font-size: 62px; line-height: 1.04; margin-top: 18px; }
  .caption p { font-size: 28px; line-height: 1.5; color: var(--slate); margin-top: 22px; }
  /* points */
  .pts { position: absolute; left: 120px; right: 120px; top: 240px; }
  .pts h2 { font-size: 92px; margin-top: 16px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; margin-top: 70px; }
  .card { border-radius: 30px; padding: 44px 40px; background: linear-gradient(180deg, rgba(18,26,53,.8), rgba(13,18,48,.6)); border: 1.5px solid rgba(165,139,255,.2); min-height: 300px; }
  .card .n { font-family: "Cormorant", serif; font-size: 64px; color: rgba(216,180,119,.45); line-height: 1; }
  .card h3 { font-family: "Cormorant", serif; font-weight: 500; font-size: 50px; margin-top: 18px; }
  .card p { font-size: 26px; color: var(--slate); margin-top: 14px; line-height: 1.45; }
  /* compare */
  .cmp { position: absolute; left: 180px; right: 180px; top: 200px; }
  .cmp h2 { font-size: 86px; margin-top: 14px; }
  table { width: 100%; margin-top: 56px; border-collapse: separate; border-spacing: 0 16px; font-size: 32px; }
  th { text-align: left; color: var(--slate); font-weight: 500; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; padding: 0 30px; }
  td { padding: 30px; background: rgba(18,26,53,.7); border-top: 1.5px solid rgba(165,139,255,.16); border-bottom: 1.5px solid rgba(165,139,255,.16); }
  td:first-child { border-left: 1.5px solid rgba(165,139,255,.16); border-radius: 22px 0 0 22px; }
  td:last-child { border-right: 1.5px solid rgba(216,180,119,.45); border-radius: 0 22px 22px 0; color: #f1dcae; font-weight: 600; background: rgba(216,180,119,.08); }
  td.o { color: var(--slate); }
  /* outro */
  .outro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .outro .word { font-family: "Cormorant", serif; font-size: 120px; letter-spacing: .3em; margin-left: .3em; color: #ecd3a2; }
  .outro .tag { font-size: 26px; letter-spacing: .5em; color: var(--slate); margin-top: 10px; }
  .outro .line { font-family: "Cormorant", serif; font-size: 70px; margin-top: 70px; }
  .outro .cta { margin-top: 46px; font-size: 34px; font-weight: 700; color: #1a1407; padding: 24px 56px; border-radius: 999px; background: linear-gradient(180deg, #ecd3a2, #d8b477 55%, #c39a5c); box-shadow: 0 20px 60px -16px rgba(216,180,119,.7); }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="stars" width="1920" height="1080"></canvas>
<div id="root"></div>
<div class="brand"><svg width="58" height="58" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1DCAE"/><stop offset=".55" stop-color="#D8B477"/><stop offset="1" stop-color="#B98D4F"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A58BFF"/><stop offset="1" stop-color="#7256D8"/></linearGradient></defs><path d="M40.21 11.45A24 24 0 1 1 23.79 11.45" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/><path d="M32 50C27.2 42.4 27.4 34.6 32 27.6C36.6 34.6 36.8 42.4 32 50Z" fill="url(#v)" opacity=".9"/><polyline points="17.5,25 23.5,36 32,50 40.5,36 46.5,25" stroke="url(#g)" stroke-width="1.1" stroke-linejoin="round" opacity=".85"/><circle cx="17.5" cy="25" r="1.7" fill="#F1DCAE"/><circle cx="23.5" cy="36" r="1.7" fill="#F1DCAE"/><circle cx="40.5" cy="36" r="1.7" fill="#F1DCAE"/><circle cx="46.5" cy="25" r="1.7" fill="#F1DCAE"/><circle cx="32" cy="50" r="2.3" fill="#FFF3D6"/><path d="M32 3.2L33.4 8.6L38.8 10L33.4 11.4L32 16.8L30.6 11.4L25.2 10L30.6 8.6Z" fill="#FFF3D6"/></svg><span>VYOMIRA</span></div>
<div class="url">vyomira.cloudisoft.com</div>
<div class="progress" id="progress"></div>
<script src="videos.js"></script>
<script>
const W = 1920, H = 1080, DUR = 30;
const V = window.VIDEOS[new URLSearchParams(location.search).get("v") || "1"];
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const easeIO = (x) => { x = Math.min(1, Math.max(0, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };

/* ---------- stars (deterministic) ---------- */
const sc = document.getElementById("stars").getContext("2d");
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const stars = Array.from({ length: 520 }, () => ({ x: rnd() * W, y: rnd() * H, r: rnd() < .8 ? .6 + rnd() * .7 : 1.2 + rnd() * 1.2, ph: rnd() * 6.28, sp: .5 + rnd() * 1.5, c: rnd() }));
function drawStars(t) {
  sc.clearRect(0, 0, W, H);
  for (const s of stars) {
    const tw = .5 + .5 * Math.sin(t * s.sp + s.ph);
    sc.globalAlpha = .25 + tw * .6 * (s.r > 1.2 ? 1 : .7);
    sc.fillStyle = s.c > .93 ? "#F1DCAE" : s.c > .82 ? "#C9B8FF" : "#F4F1FB";
    const drift = t * (s.r > 1.2 ? 6 : 3);
    sc.beginPath(); sc.arc((s.x - drift + W) % W, s.y, s.r, 0, 6.283); sc.fill();
  }
  // a shooting star every ~7 s
  const k = Math.floor(t / 7), lt = t - k * 7;
  if (lt < 1.1) {
    seed = 99 + k * 31; const x0 = 500 + rnd() * 1200, y0 = 60 + rnd() * 260;
    const p = lt / 1.1, x = x0 - p * 700, y = y0 + p * 300, a = Math.sin(Math.PI * p);
    const g = sc.createLinearGradient(x, y, x + 160, y - 70); g.addColorStop(0, `rgba(255,246,226,${a})`); g.addColorStop(1, "rgba(165,139,255,0)");
    sc.globalAlpha = 1; sc.strokeStyle = g; sc.lineWidth = 2; sc.beginPath(); sc.moveTo(x, y); sc.lineTo(x + 160, y - 70); sc.stroke();
  }
  sc.globalAlpha = 1;
}

/* ---------- rotating globe (same method as the site's GlobeCanvas) ---------- */
const TW = 512, TH = 256;
function hash(x, y, z) { let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function noise3(x, y, z) { const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf); const l = (a, b, t) => a + (b - a) * t, c = (a, b, d) => hash(xi + a, yi + b, zi + d); return l(l(l(c(0,0,0), c(1,0,0), u), l(c(0,1,0), c(1,1,0), u), v), l(l(c(0,0,1), c(1,0,1), u), l(c(0,1,1), c(1,1,1), u), v), w); }
function fbm(x, y, z) { let v = 0, a = .5; for (let i = 0; i < 5; i++) { v += a * noise3(x, y, z); x *= 2.03; y *= 2.03; z *= 2.03; a *= .5; } return v; }
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * Math.max(0, Math.min(1, t)));
const smooth = (e0, e1, x) => { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
let TEX = null;
function texture() {
  if (TEX) return TEX;
  TEX = new Uint8ClampedArray(TW * TH * 3);
  const deep = [9, 11, 36], indigo = [33, 31, 102], violet = [77, 56, 168], lilac = [168, 148, 237], gold = [219, 179, 115];
  const st = [[.72, -.28, .63], [-.8, .22, .55], [.1, .42, -.9], [-.35, -.55, -.76]].map((s) => { const n = Math.hypot(...s); return s.map((v) => v / n); });
  for (let j = 0; j < TH; j++) { const lat = (.5 - (j + .5) / TH) * Math.PI; for (let i = 0; i < TW; i++) {
    const lon = ((i + .5) / TW) * Math.PI * 2, px = Math.cos(lat) * Math.cos(lon), py = Math.sin(lat), pz = Math.cos(lat) * Math.sin(lon);
    const la = py + (fbm(px * 3, py * 3, pz * 3) - .5) * .22, bands = .5 + .5 * Math.sin(la * 22 + fbm(px * 6, py * 6, pz * 6) * 3), fine = fbm(px * 2, la * 18, pz * 2);
    const patches = smooth(.52, .68, fbm(px * 2.4 + 7, py * 2.4 + 7, pz * 2.4 + 7));
    let sd = 9; st.forEach((s, k) => { sd = Math.min(sd, Math.hypot(px - s[0], py - s[1], pz - s[2]) * (1 + k * .15)); });
    const storm = smooth(.3, 0, sd), swirl = fbm(px * 14 + sd * 20, py * 14 + sd * 20, pz * 14 + sd * 20);
    let c = mix(deep, indigo, bands); c = mix(c, violet, smooth(.45, .85, fine) * .8); c = mix(c, lilac, smooth(.72, .95, fine * bands) * .5);
    c = mix(c, mix(lilac, gold, fbm(px * 5, py * 5, pz * 5)), patches * .45); c = mix(c, mix(gold, lilac, swirl), storm * .8);
    const o = (j * TW + i) * 3; TEX[o] = c[0]; TEX[o + 1] = c[1]; TEX[o + 2] = c[2];
  } }
  return TEX;
}
function makeGlobe(size) {
  const cv = document.createElement("canvas"); cv.width = cv.height = size;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(size, size), d = img.data, tex = texture();
  const r = size / 2 - 1, ct = Math.cos(-.3), sn = Math.sin(-.3), L = [-.62, .42, .66], ln = Math.hypot(...L); L.forEach((v, i) => L[i] = v / ln);
  const px = [];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const nx = (x + .5 - size / 2) / r, ny = (size / 2 - y - .5) / r, d2 = nx * nx + ny * ny; if (d2 > 1) continue;
    const nz = Math.sqrt(1 - d2), bx = nx * ct + ny * sn, by = -nx * sn + ny * ct, lat = Math.asin(Math.max(-1, Math.min(1, by))), lon = Math.atan2(nz, bx);
    const ndl = nx * L[0] + ny * L[1] + nz * L[2], day = smooth(-.15, .45, ndl), e = Math.sqrt(d2);
    px.push([(y * size + x) * 4, Math.min(TH - 1, Math.floor((.5 - lat / Math.PI) * TH)), ((lon / (Math.PI * 2)) * TW + TW * 4) % TW, .07 + day * 1.12, Math.pow(1 - nz, 3) * (.25 + day * .55), e > .985 ? Math.max(0, (1 - e) / .015) * 255 : 255]);
  }
  return { cv, draw(t) { const off = (t * .04 * TW) % TW; for (const [p, row, bc, s, rm, a] of px) { let c = (bc + off) | 0; if (c >= TW) c -= TW; const o = (row * TW + c) * 3; d[p] = tex[o] * s + 158 * rm; d[p + 1] = tex[o + 1] * s + 133 * rm; d[p + 2] = tex[o + 2] * s + 255 * rm; d[p + 3] = a; } ctx.putImageData(img, 0, 0); } };
}
const ringSvg = `<svg class="ring" viewBox="0 0 200 200"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#D8B477" stop-opacity="0"/><stop offset=".5" stop-color="#D8B477" stop-opacity=".9"/><stop offset="1" stop-color="#A58BFF" stop-opacity="0"/></linearGradient><clipPath id="fr"><rect x="0" y="100" width="200" height="100"/></clipPath></defs><g clip-path="url(#fr)"><ellipse cx="100" cy="100" rx="90" ry="19.3" fill="none" stroke="url(#rg)" stroke-width="9" opacity=".18"/><ellipse cx="100" cy="100" rx="94" ry="20" fill="none" stroke="url(#rg)" stroke-width="1.6" opacity=".6"/><ellipse cx="100" cy="100" rx="80" ry="17" fill="none" stroke="url(#rg)" stroke-width="1.2"/></g></svg>`;

/* ---------- scenes ---------- */
const root = document.getElementById("root");
const built = V.scenes.map((s, si) => {
  let node, upd;
  if (s.type === "hook" || s.type === "outro") {
    const g = makeGlobe(s.type === "hook" ? 720 : 760);
    const gw = el(`<div class="globeWrap"><div class="glow"></div></div>`); gw.appendChild(g.cv); gw.appendChild(el(`<div class="rim"></div>`)); gw.insertAdjacentHTML("beforeend", ringSvg);
    if (s.type === "hook") {
      const words = s.lines.map((l) => l.split(" "));
      node = el(`<div class="scene"><div class="hook serif">${s.lines.map((l, li) => `<div class="l">${l.split(" ").map((w) => `<span class="w${s.accent && s.accent.split(" ").includes(w) && li === s.lines.length - 1 ? " gold" : ""}">${w}</span>`).join(" ")}</div>`).join("")}</div></div>`);
      node.appendChild(gw);
      const ws = [...node.querySelectorAll(".w")];
      upd = (lt, len) => { g.draw(lt + si * 3); ws.forEach((w, i) => { const p = ease((lt - .2 - i * .12) / .9); w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 50}px)`; w.style.filter = `blur(${(1 - p) * 10}px)`; }); const gp = ease(lt / 1.6); gw.style.transform = `scale(${.9 + .1 * gp}) translateX(${(1 - gp) * 80}px)`; gw.style.opacity = gp; };
    } else {
      gw.style.cssText = "right:auto;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.28";
      node = el(`<div class="scene"><div class="outro"><div class="word">VYOMIRA</div><div class="tag">YOUR UNIVERSE · YOUR STORY</div><div class="line">${s.line}</div><div class="cta">vyomira.cloudisoft.com</div></div></div>`);
      node.prepend(gw);
      const parts = [...node.querySelectorAll(".word,.tag,.line,.cta")];
      upd = (lt) => { g.draw(lt); parts.forEach((p, i) => { const k = ease((lt - .15 - i * .35) / .9); p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 30}px)`; }); };
    }
  } else if (s.type === "shot") {
    const right = s.side === "right";
    node = el(`<div class="scene"><div class="frame" style="${right ? "right:110px" : "left:110px"}"><div class="bar"><i></i><i></i><i></i><b>vyomira.cloudisoft.com</b></div><div class="vp"><img src="assets/${s.img}.png"></div></div><div class="caption" style="${right ? "left:100px" : "right:90px"}"><div class="eyebrow">${s.eyebrow}</div><h2 class="serif">${s.title}</h2><p>${s.text}</p></div></div>`);
    const fr = node.querySelector(".frame"), img = node.querySelector("img"), cap = [...node.querySelector(".caption").children];
    upd = (lt, len) => {
      const p = easeIO(lt / len), sc = lerp(s.from[2], s.to[2], p);
      img.style.transform = `translate(${-lerp(s.from[0], s.to[0], p) * 1080}px, ${-lerp(s.from[1], s.to[1], p) * 675}px) scale(${sc})`;
      const fi = ease(lt / .9); fr.style.transform = `translateY(${(1 - fi) * 60}px) perspective(2000px) rotateY(${(right ? 1 : -1) * (1 - fi) * 8}deg)`; fr.style.opacity = fi;
      cap.forEach((c, i) => { const k = ease((lt - .35 - i * .22) / .8); c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 26}px)`; });
    };
  } else if (s.type === "points") {
    node = el(`<div class="scene"><div class="pts"><div class="eyebrow">${s.eyebrow}</div><h2 class="serif">${s.title}</h2><div class="cards">${s.items.map(([h, p], i) => `<div class="card"><div class="n">0${i + 1}</div><h3>${h}</h3><p>${p}</p></div>`).join("")}</div></div></div>`);
    const head = [...node.querySelectorAll(".eyebrow,h2")], cards = [...node.querySelectorAll(".card")];
    upd = (lt) => { head.forEach((h, i) => { const k = ease((lt - i * .2) / .8); h.style.opacity = k; h.style.transform = `translateY(${(1 - k) * 24}px)`; }); cards.forEach((c, i) => { const k = ease((lt - .7 - i * .45) / .9); c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 60}px) scale(${.96 + .04 * k})`; }); };
  } else if (s.type === "compare") {
    node = el(`<div class="scene"><div class="cmp"><div class="eyebrow">${s.eyebrow}</div><h2 class="serif">${s.title}</h2><table><thead><tr>${s.head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${s.rows.map((r) => `<tr><td>${r[0]}</td><td class="o">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></div>`);
    const head = [...node.querySelectorAll(".eyebrow,h2,thead")], rows = [...node.querySelectorAll("tbody tr")];
    upd = (lt) => { head.forEach((h, i) => { const k = ease((lt - i * .2) / .8); h.style.opacity = k; h.style.transform = `translateY(${(1 - k) * 24}px)`; }); rows.forEach((r, i) => { const k = ease((lt - .8 - i * .5) / .8); r.style.opacity = k; r.style.transform = `translateX(${(1 - k) * -50}px)`; }); };
  }
  root.appendChild(node);
  return { s, node, upd };
});

window.renderAt = (t) => {
  drawStars(t);
  document.getElementById("progress").style.width = `${(t / DUR) * 100}%`;
  for (const b of built) {
